name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check installed dependencies
        run: python -m pip check

      - name: Check required imports
        run: >-
          python -c "import jupyter, matplotlib, numpy, pandas, seaborn, sklearn"

      - name: Validate notebook structure and Python syntax
        run: python scripts/validate_notebook.py notebooks/spy-analysis.ipynb
